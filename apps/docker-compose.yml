version: '3.8'

networks:
  smarthome-network:
    driver: bridge
services:
  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: temperature-app
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smarthome-network
  device-management:
    build:
      context: ../
      dockerfile: Dockerfile_dm
    depends_on:
      device-management-postgres:
        condition: service_started
      temperature-api:
        condition: service_started
    container_name: device-management-app
    environment:
      DATABASE_URL: jdbc:postgresql://device-management-postgres:5432/device_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TEMPERATURE_API_URL: http://temperature-api:8081
    ports:
      - "8083:8083"
    restart: unless-stopped
    networks:
      - smarthome-network
  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      temperature-api:
        condition: service_started
      device-management:
        condition: service_started
    environment:
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - DEVICE_MANAGEMENT_URL=http://device-management:8083
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network
  device-management-postgres:
    image: postgres:16-alpine
    container_name: device-management-postgres
    hostname: dmp
    ports:
      - "5432:5432"
    volumes:
      - ./apps/device_management/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_dm:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    restart: unless-stopped
    networks:
      - smarthome-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres" ]
      interval: 10s
      timeout: 2s
      retries: 5
volumes:
  postgres_dm:
